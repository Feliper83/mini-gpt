[project]
name = "mini-gpt"
version = "0.1.0"
description = "A GPT-style decoder-only transformer implemented from scratch in PyTorch, for educational purposes."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets>=5.0.1",
    "flask>=3.1.3",
    "matplotlib>=3.11.1",
    "torch>=2.4",
    "truststore>=0.10.4",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
